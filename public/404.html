<!doctype html>
<!--
  GitHub Pages has no server, so it can't be told "always serve index.html"
  for client-side routes like /travel or /books. This page is what GH Pages
  serves for any unknown path; it encodes the real path into a query string
  and bounces to index.html, which decodes it back in the inline script
  there. This is the standard workaround — see https://github.com/rafgraph/spa-github-pages
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Field Log</title>
    <script>
      var pathSegmentsToKeep = 1; // matches the "/fieldlog/" base path segment
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?p=/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
